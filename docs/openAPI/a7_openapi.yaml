openapi: 3.0.0
info:
  version: '1.0'
  title: 'Platform API'
  description: 'API for core platform functionalities including authentication, profile management, search, timelines, posts, and administrative actions.'
servers:
  - url: https://lbaw.fe.up.pt
    description: Production Server

tags:
  - name: "Authentication"
    description: "Endpoints for user authentication"
  - name: "Profile"
    description: "Endpoints for profile management"
  - name: "Search"
    description: "Endpoints for search functionalities"
  - name: "Post"
    description: "Endpoints for viewing, creating, editing, and deleting posts"
  - name: "Admin"
    description: "Endpoints for administrative actions"

paths:
  /auth/login:
    post:
      summary: "Login"
      description: "Authenticate a user and create a session. Access: PUB"
      tags:
        - "Authentication"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: "User's email address"
                password:
                  type: string
                  description: "User's password"
              required:
                - email
                - password
      responses:
        '200':
          description: "Login successful, returns session token"
        '401':
          description: "Invalid credentials"

  /auth/logout:
    post:
      summary: "Logout"
      description: "End the user session. Access: USR"
      tags:
        - "Authentication"
      responses:
        '200':
          description: "Logout successful"

  /admin/users:
    get:
      summary: "Search Users"
      description: "View and search user accounts. Access: ADM"
      tags:
        - "Admin"
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: "Search term for user accounts (e.g., username or email)"
      responses:
        '200':
          description: "User accounts retrieved successfully"
        '400':
          description: "Invalid search query"

    post:
      summary: "Create User"
      description: "Create a new user account. Access: ADM"
      tags:
        - "Admin"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: "New user's username"
                email:
                  type: string
                  format: email
                  description: "New user's email"
                name:
                  type: string
                  description: "New user's full name"
                password:
                  type: string
                  description: "New user's password"
                visibility:
                  type: string
                  enum: ["public", "private"]
                  description: "User visibility status"
                account_status:
                  type: string
                  enum: ["active", "blocked", "deleted", "offline"]
                  description: "Account status"
              required:
                - username
                - email
                - name
                - password
                - visibility
                - account_status
      responses:
        '201':
          description: "User account created successfully"
        '400':
          description: "Invalid input data"

  /admin/users/{id}:
    get:
      summary: "View User Details"
      description: "View detailed information of a specific user. Access: ADM"
      tags:
        - "Admin"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "ID of the user"
      responses:
        '200':
          description: "User details retrieved successfully"
        '404':
          description: "User not found"

    put:
      summary: "Edit User"
      description: "Edit a specific user's account details. Access: ADM"
      tags:
        - "Admin"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: "Updated email address"
                name:
                  type: string
                  description: "Updated full name"
                username:
                  type: string
                  description: "Updated username"
                visibility:
                  type: string
                  enum: ["public", "private"]
                  description: "Updated visibility status"
                account_status:
                  type: string
                  enum: ["active", "blocked", "deleted", "offline"]
                  description: "Updated account status"
              required:
                - email
                - name
                - username
                - visibility
                - account_status
      responses:
        '200':
          description: "User details updated successfully"
        '400':
          description: "Invalid input data"
        '404':
          description: "User not found"

    delete:
      summary: "Delete User"
      description: "Delete a specific user account. Access: ADM"
      tags:
        - "Admin"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "ID of the user to delete"
      responses:
        '200':
          description: "User account deleted successfully"
        '404':
          description: "User not found"
