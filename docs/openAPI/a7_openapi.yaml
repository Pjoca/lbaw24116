openapi: 3.0.0
info:
  version: '1.0'
  title: 'Platform API'
  description: 'API for core platform functionalities including authentication, profile management, search, timelines, and posts.'
servers:
  - url: https://lbaw.fe.up.pt
    description: Production Server

tags:
  - name: "Authentication"
    description: "Endpoints for user authentication"
  - name: "Profile"
    description: "Endpoints for profile management"
  - name: "Search"
    description: "Endpoints for search functionalities"
  - name: "Admin"
    description: "Endpoints for administrative actions"
  - name: "Post"
    description: "Endpoints for viewing, creating, editing, and deleting posts"

paths:
  /:
    get:
      summary: "Redirect to Login"
      description: "Redirects unauthenticated users to login. Access: PUB"
      tags:
        - "Authentication"
      responses:
        '302':
          description: "Redirects to login page"

  /auth/login:
    get:
      summary: "Login Page"
      description: "Displays the login form. Access: PUB"
      tags:
        - "Authentication"
      responses:
        '200':
          description: "Login page displayed successfully"

    post:
      summary: "Login"
      description: "Authenticate a user and create a session. Access: PUB"
      tags:
        - "Authentication"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: "User's email address"
                password:
                  type: string
                  description: "User's password"
              required:
                - email
                - password
      responses:
        '200':
          description: "Login successful"
        '401':
          description: "Invalid credentials"

  /auth/logout:
    get:
      summary: "Logout"
      description: "Ends the user session. Access: USR"
      tags:
        - "Authentication"
      responses:
        '200':
          description: "Logout successful"

  /auth/register:
    get:
      summary: "Register Page"
      description: "Displays the registration form. Access: PUB"
      tags:
        - "Authentication"
      responses:
        '200':
          description: "Registration page displayed successfully"

    post:
      summary: "Register"
      description: "Register a new user. Access: PUB"
      tags:
        - "Authentication"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: "Unique username for the user"
                email:
                  type: string
                  format: email
                  description: "FEUP institutional email (@up.pt)"
                password:
                  type: string
                  description: "User's password"
                name:
                  type: string
                  description: "Full name of the user"
              required:
                - username
                - email
                - password
                - name
      responses:
        '201':
          description: "User registered successfully"
        '400':
          description: "Invalid input data"

  /timeline:
    get:
      summary: "Timeline redirect"
      description: "Redirects to personalized or public timeline based on authentication. Access: PUB"
      tags:
        - "Post"
      responses:
        '302':
          description: "Redirected to the appropriate timeline"

  /timeline/public:
    get:
      summary: "Public Timeline"
      description: "Retrieve public timeline posts. Access: PUB"
      tags:
        - "Post"
      responses:
        '200':
          description: "Timeline retrieved successfully"

  /timeline/personalized:
    get:
      summary: "Personalized Timeline"
      description: "Retrieve personalized timeline posts. Access: USR"
      tags:
        - "Post"
      responses:
        '200':
          description: "Personalized timeline retrieved successfully"
        '401':
          description: "Unauthorized access"

  /profile/{id}:
    get:
      summary: "View Profile"
      description: "Retrieve the profile information of a user. Access: USR"
      tags:
        - "Profile"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "ID of the user"
      responses:
        '200':
          description: "Profile retrieved successfully"
        '404':
          description: "Profile not found"

    put:
      summary: "Edit Profile"
      description: "Update the profile information of the authenticated user. Access: OWN"
      tags:
        - "Profile"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "ID of the user"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "Full name of the user"
                email:
                  type: string
                  description: "Email address of the user"
                visibility:
                  type: string
                  enum: ["public", "private"]
                  description: "Visibility status of the user"
              required:
                - name
                - email
                - visibility
      responses:
        '200':
          description: "Profile updated successfully"
        '400':
          description: "Invalid input data"

  /post:
    post:
      summary: "Create Post"
      description: "Create a new post. Access: USR"
      tags:
        - "Post"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: "Content of the post"
                visibility:
                  type: string
                  enum: ["public", "private", "group"]
                  description: "Visibility of the post"
                id_group:
                  type: integer
                  description: "Group ID for the post (optional)"
                image:
                  type: object
                  description: "Image of the Post (optional)"
              required:
                - content
                - visibility
      responses:
        '201':
          description: "Post created successfully"
        '400':
          description: "Invalid input data"

  /post/{id}:
    put:
      summary: "Edit Post"
      description: "Edit an existing post. Access: OWN"
      tags:
        - "Post"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "ID of the post to edit"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: "Content of the post"
                visibility:
                  type: string
                  enum: ["public", "private", "group"]
                  description: "Visibility of the post"
              required:
                - content
                - visibility
      responses:
        '200':
          description: "Post updated successfully"
        '400':
          description: "Invalid input data"
        '404':
          description: "Post not found"

    delete:
      summary: "Delete Post"
      description: "Delete an existing post. Access: OWN"
      tags:
        - "Post"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "ID of the post to delete"
      responses:
        '200':
          description: "Post deleted successfully"
        '404':
          description: "Post not found"

  /search/users:
    get:
      summary: "Search Users"
      description: "Search users based on criteria. Access: USR"
      tags:
        - "Search"
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: "Search term for users"
      responses:
        '200':
          description: "Search results returned successfully"
        '400':
          description: "Invalid search query"

  /admin:
    get:
      summary: "Admin Panel"
      description: "Access the main admin panel. Access: ADM"
      tags:
        - "Admin"
      responses:
        '200':
          description: "Admin panel retrieved successfully"
        '401':
          description: "Unauthorized access"


  /admin/users/{id}:
    get:
      summary: "View User Details"
      description: "View detailed information of a specific user. Access: ADM"
      tags:
        - "Admin"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "ID of the user"
      responses:
        '200':
          description: "User details retrieved successfully"
        '404':
          description: "User not found"

    put:
      summary: "Edit User"
      description: "Edit a specific user's account details. Access: ADM"
      tags:
        - "Admin"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "ID of the user"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: "Updated email address"
                name:
                  type: string
                  description: "Updated full name"
                username:
                  type: string
                  description: "Updated username"
                visibility:
                  type: string
                  enum: ["public", "private"]
                  description: "Updated visibility status"
                account_status:
                  type: string
                  enum: ["active", "blocked", "deleted", "offline"]
                  description: "Updated account status"
              required:
                - email
                - name
                - username
                - visibility
                - account_status
      responses:
        '200':
          description: "User details updated successfully"
        '400':
          description: "Invalid input data"
        '404':
          description: "User not found"

    delete:
      summary: "Delete User"
      description: "Delete a specific user account. Access: ADM"
      tags:
        - "Admin"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "ID of the user to delete"
      responses:
        '200':
          description: "User account deleted successfully"
        '404':
          description: "User not found"

